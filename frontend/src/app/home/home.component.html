<section class="home-shell">
    <header class="home-header">
        <a routerLink="/home" class="logo">
            <svg class="logo-svg" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V21C3 22.11 3.89 23 5 23H19C20.11 23 21 22.11 21 21V9M19 9H14V4H5V21H19V9Z" />
            </svg>
            <span class="logo-text">MED</span>
        </a>
        <h1>Welcome to Med App</h1>
        <button (click)="logout()" class="logout-btn">Logout</button>
    </header>

    <main class="home-content">
        <div class="welcome-card">
            <h2>Dashboard</h2>
            <p>You are successfully logged in!!! </p>
            <div class="features">
                <div class="feature-card">
                    <h3>Users</h3>
                    <p>Manage user accounts</p>
                    <button routerLink="/users">View Users</button>
                </div>
                <div class="feature-card">
                    <h3>Profile</h3>
                    <p>Update your profile</p>
                    <button>Edit Profile</button>
                </div>
            </div>
        </div>
    </main>
</section>
