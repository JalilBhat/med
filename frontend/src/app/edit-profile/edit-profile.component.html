<section class="edit-profile-shell">
    <header class="edit-profile-header">
        <a routerLink="/home" class="logo">
            <svg class="logo-svg" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V21C3 22.11 3.89 23 5 23H19C20.11 23 21 22.11 21 21V9M19 9H14V4H5V21H19V9Z" />
            </svg>
            <span class="logo-text">MED</span>
        </a>
        <h1>Edit Profile</h1>
        <button (click)="goBack()" class="back-btn">Back</button>
    </header>

    <main class="edit-profile-content">
        <div class="edit-profile-card">
            <h2>Update Your Profile</h2>

            <div *ngIf="loading" class="loading">Loading profile...</div>
            <div *ngIf="error" class="error">{{ error }}</div>
            <div *ngIf="success" class="success">{{ success }}</div>

            <form *ngIf="!loading && user" (ngSubmit)="submit()" class="edit-profile-form">
                <label>
                    Username
                    <input type="text" name="username" [(ngModel)]="user.username" required />
                </label>

                <label>
                    Email
                    <input type="email" name="email" [(ngModel)]="user.email" />
                </label>

                <button type="submit" [disabled]="loading">Update Profile</button>
            </form>
        </div>
    </main>
</section>
