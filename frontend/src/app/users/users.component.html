<section class="users-shell">
    <header class="users-header">
        <a routerLink="/home" class="logo">
            <svg class="logo-svg" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V21C3 22.11 3.89 23 5 23H19C20.11 23 21 22.11 21 21V9M19 9H14V4H5V21H19V9Z" />
            </svg>
            <span class="logo-text">MED</span>
        </a>
        <h1>Users Management</h1>
        <button (click)="logout()" class="logout-btn">Logout</button>
    </header>

    <main class="users-content">
        <div class="users-card">
            <h2>All Users</h2>

            <div *ngIf="loading" class="loading">Loading users...</div>
            <div *ngIf="error" class="error">{{ error }}</div>

            <div *ngIf="!loading && !error" class="users-list">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let user of users">
                            <td>{{ user.username }}</td>
                            <td>{{ user.email || 'N/A' }}</td>
                            <td>{{ user.createdAt | date:'short' }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div *ngIf="pagination" class="pagination">
                <button (click)="goToPage(pagination.currentPage - 1)" [disabled]="!pagination.hasPrev"
                    class="page-btn">
                    Previous
                </button>

                <span class="page-info">
                    Page {{ pagination.currentPage }} of {{ pagination.totalPages }}
                    ({{ pagination.totalUsers }} total users)
                </span>

                <button (click)="goToPage(pagination.currentPage + 1)" [disabled]="!pagination.hasNext"
                    class="page-btn">
                    Next
                </button>
            </div>
        </div>
    </main>
</section>
