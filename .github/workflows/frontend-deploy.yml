name: Angular Frontend CI/CD (Render)

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**" # ✅ FIXED

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Node setup with caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3️⃣ Install deps
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Production build (IMPORTANT FIX)
      - name: Build Angular app
        run: npm run build -- --configuration production --base-href=/

      # 5️⃣ Validate build output (DEBUG SAFETY)
      - name: Verify build output
        run: ls -la dist/

      # 6️⃣ Deploy to Render (only main)
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
